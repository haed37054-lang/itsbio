<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive inspection</title>
<style>body{margin:16px;font:16px system-ui}form{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}input,select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #aaa;height:900px;flex:none}</style>
<form id="controls"><label>Site <input id="site" value="" size="48"></label><label>Path <input id="path" value="/" size="35"></label><label>Width <select id="width"><option>375</option><option>320</option><option>390</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label><button>Load</button></form>
<iframe id="preview" title="Website preview" width="375" src="/"></iframe>
<script>document.querySelector('#site').value=location.origin;document.querySelector('form').onsubmit=e=>{e.preventDefault();const frame=document.querySelector('iframe');frame.width=document.querySelector('#width').value;frame.src=new URL(document.querySelector('#path').value,document.querySelector('#site').value).href;};</script></html>
